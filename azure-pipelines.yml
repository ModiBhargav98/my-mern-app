trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "18.x"
  frontendDirectory: "frontend_loan_calendar"
  backendDirectory: "Backend_Loan_Emi_Calculator"

stages:
  - stage: Build
    displayName: Build Applications

    jobs:
      - job: BuildFrontend
        displayName: Build Frontend

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: $(frontendDirectory)
            displayName: Install Frontend Dependencies

          # react-scripts build always uses frontend_loan_calendar/.env.production
          - script: npm run build
            workingDirectory: $(frontendDirectory)
            displayName: Build React Application

          - task: ArchiveFiles@2
            displayName: Archive Frontend
            inputs:
              rootFolderOrFile: "$(frontendDirectory)/build"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/frontend.zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/frontend.zip"
            artifact: frontend
            displayName: Publish Frontend Artifact

      - job: BuildBackend
        displayName: Build Backend

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: $(backendDirectory)
            displayName: Install Backend Dependencies

          - task: ArchiveFiles@2
            displayName: Archive Backend
            inputs:
              rootFolderOrFile: "$(backendDirectory)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/backend.zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/backend.zip"
            artifact: backend
            displayName: Publish Backend Artifact

  - stage: TestLocalAgent
    displayName: Test Local Windows Agent
    dependsOn: Build

    jobs:
      - job: VerifyAgent
        displayName: Verify LoanCalculatorAgent
        pool:
          name: Practice

        steps:
          - checkout: none

          - powershell: |
              Write-Host "Self-hosted agent is working!"
              Write-Host "Computer: $env:COMPUTERNAME"
              Write-Host "User: $env:USERNAME"
              node --version
              npm --version
            displayName: Verify Local Environment

  - stage: DeployLocal
    displayName: Deploy to Local Machine
    dependsOn: TestLocalAgent

    jobs:
      - job: DeployLocalJob
        pool:
          name: Practice
          demands:
            - Agent.Name -equals LoanCalculatorAgent

        steps:
          - checkout: none

          - download: current
            artifact: frontend

          - download: current
            artifact: backend

          - powershell: |
              $root = "C:\local-deploy\loan-calculator"

              New-Item -ItemType Directory -Force "$root\frontend" | Out-Null
              New-Item -ItemType Directory -Force "$root\backend" | Out-Null

              Expand-Archive `
                "$(Pipeline.Workspace)\frontend\frontend.zip" `
                "$root\frontend" -Force

              Expand-Archive `
                "$(Pipeline.Workspace)\backend\backend.zip" `
                "$root\backend" -Force

              Write-Host "Artifacts extracted successfully."
              Write-Host "Location: $root"

              # Backend secrets are NOT in git. Keep .env.production on this machine once:
              #   C:\local-deploy\loan-calculator\backend\.env.production
              # (Expand-Archive -Force does not delete it on next deploy)
              if (-not (Test-Path "$root\backend\.env.production")) {
                Write-Host "##vso[task.logissue type=warning]Missing $root\backend\.env.production - backend will not start. Create it with PORT, MONGO_URI, JWT_SECRET."
              } else {
                Write-Host "Backend .env.production found."
              }
              Write-Host "Start backend with: npm run start:prod"
            displayName: Download and Extract Artifacts
