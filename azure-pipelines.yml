trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "18.x"
  frontendDirectory: "frontend_loan_calendar"
  backendDirectory: "Backend_Loan_Emi_Calculator"

stages:
  - stage: Build
    displayName: Build Applications

    jobs:
      - job: BuildFrontend
        displayName: Build Frontend

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: $(frontendDirectory)
            displayName: Install Frontend Dependencies

          - script: npm run build
            workingDirectory: $(frontendDirectory)
            displayName: Build React Application

          - task: ArchiveFiles@2
            displayName: Archive Frontend
            inputs:
              rootFolderOrFile: "$(frontendDirectory)/build"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/frontend.zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/frontend.zip"
            artifact: frontend
            displayName: Publish Frontend Artifact

      - job: BuildBackend
        displayName: Build Backend

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            workingDirectory: $(backendDirectory)
            displayName: Install Backend Dependencies

          - task: ArchiveFiles@2
            displayName: Archive Backend
            inputs:
              rootFolderOrFile: "$(backendDirectory)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/backend.zip"
              replaceExistingArchive: true

          - publish: "$(Build.ArtifactStagingDirectory)/backend.zip"
            artifact: backend
            displayName: Publish Backend Artifact
